services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-physiosync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-physiosync}
      POSTGRES_DB: ${POSTGRES_DB:-physiosync}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-physiosync}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-physiosync}:${POSTGRES_PASSWORD:-physiosync}@db:5432/${POSTGRES_DB:-physiosync}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./services/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
